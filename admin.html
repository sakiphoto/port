<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการพอร์ตโฟลิโอ (Admin)</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --secondary: #0f172a;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1.5rem; min-height: 100vh; }
    .container { max-width: 800px; margin: 0 auto; }
    
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      margin-bottom: 2rem;
    }
    h2 { color: var(--secondary); margin-bottom: 1.5rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 500; font-size: 0.9rem; color: #475569; }
    input[type="text"], input[type="password"], select, input[type="file"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
      transition: border 0.2s;
    }
    input:focus, select:focus { border-color: var(--primary); }
    
    .btn {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.95; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: #64748b; font-size: 0.85rem; padding: 0.4rem 0.8rem; width: auto; }

    /* List view */
    .item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid #f1f5f9;
    }
    .item-row:last-child { border-bottom: none; }
    .item-meta { display: flex; align-items: center; gap: 1rem; }
    .item-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #e2e8f0; }
    .btn-delete { background: var(--danger); color: white; border: none; padding: 0.4rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">

    <!-- ส่วน Login -->
    <div id="loginSection" class="card">
      <h2>🔐 เข้าสู่ระบบ Admin</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>รหัสผ่าน</label>
          <input type="password" id="adminPassword" required placeholder="ใส่รหัสผ่าน admin">
        </div>
        <button type="submit" class="btn" id="loginBtn">เข้าสู่ระบบ</button>
      </form>
    </div>

    <!-- ส่วน Admin Panel -->
    <div id="adminPanel" class="hidden">
      <div class="card">
        <h2>
          <span>📤 อัปโหลดผลงานใหม่</span>
          <button class="btn btn-outline" onclick="logout()">ออกจากระบบ</button>
        </h2>
        <form id="uploadForm" onsubmit="handleUpload(event)">
          <div class="form-group">
            <label>ชื่อภาพ / ผลงาน</label>
            <input type="text" id="title" required placeholder="เช่น Sunset at the beach">
          </div>
          <div class="form-group">
            <label>หมวดหมู่</label>
            <input type="text" id="category" required placeholder="เช่น Portrait, Wedding, Landscape">
          </div>
          <div class="form-group">
            <label>ประเภทไฟล์</label>
            <select id="mediaType">
              <option value="image">รูปภาพ (Image)</option>
              <option value="video">วิดีโอ (Video)</option>
            </select>
          </div>
          <div class="form-group">
            <label>เลือกไฟล์</label>
            <input type="file" id="fileInput" accept="image/*,video/*" required>
          </div>
          <button type="submit" class="btn" id="uploadBtn">อัปโหลดผลงาน</button>
        </form>
      </div>

      <div class="card">
        <h2>📋 รายการผลงานทั้งหมด</h2>
        <div id="itemsList">กำลังโหลด...</div>
      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzyWvESyDYpi1ndxtFSLpWnC0Y5W4awL1OC9tjJ0HJNe8tFUczDV3Vrr2qPaVgQ0uWaWg/exec";
    let token = sessionStorage.getItem("adminPassword");

    if (token) {
      showPanel();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const pwd = document.getElementById("adminPassword").value;
      const btn = document.getElementById("loginBtn");
      btn.innerText = "กำลังตรวจสอบ...";
      btn.disabled = true;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "login", password: pwd })
        });
        const data = await res.json();
        
        if (data.success) {
          sessionStorage.setItem("adminPassword", pwd);
          token = pwd;
          showPanel();
        } else {
          alert(data.message || "รหัสผ่านไม่ถูกต้อง");
        }
      } catch (err) {
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อ");
      } finally {
        btn.innerText = "เข้าสู่ระบบ";
        btn.disabled = false;
      }
    }

    function showPanel() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("adminPanel").classList.remove("hidden");
      loadItems();
    }

    function logout() {
      sessionStorage.removeItem("adminPassword");
      location.reload();
    }

    async function handleUpload(e) {
      e.preventDefault();
      const fileInput = document.getElementById("fileInput");
      const file = fileInput.files[0];
      if (!file) return;

      const btn = document.getElementById("uploadBtn");
      btn.innerText = "กำลังอัปโหลด (อาจใช้เวลาสักครู่)...";
      btn.disabled = true;

      const reader = new FileReader();
      reader.onload = async function() {
        const payload = {
          action: "upload",
          password: token,
          title: document.getElementById("title").value,
          category: document.getElementById("category").value,
          mediaType: document.getElementById("mediaType").value,
          fileName: file.name,
          fileData: reader.result
        };

        try {
          const res = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          if (result.success) {
            alert("อัปโหลดสำเร็จ!");
            document.getElementById("uploadForm").reset();
            loadItems();
          } else {
            alert("ผิดพลาด: " + result.message);
          }
        } catch(err) {
          alert("เกิดข้อผิดพลาดในการส่งข้อมูล");
        } finally {
          btn.innerText = "อัปโหลดผลงาน";
          btn.disabled = false;
        }
      };
      reader.readAsDataURL(file);
    }

    async function loadItems() {
      const container = document.getElementById("itemsList");
      container.innerHTML = "กำลังโหลด...";
      try {
        const res = await fetch(API_URL);
        const result = await res.json();
        if (result.success) {
          if (result.data.length === 0) {
            container.innerHTML = "<p style='color: #94a3b8;'>ยังไม่มีผลงาน</p>";
            return;
          }
          container.innerHTML = result.data.map(item => `
            <div class="item-row">
              <div class="item-meta">
                ${item.mediaType === 'image' 
                  ? `<img src="${item.fileUrl}" class="item-thumb">` 
                  : `<span style="font-size: 1.8rem;">🎬</span>`}
                <div>
                  <strong>${item.title}</strong>
                  <div style="font-size: 0.8rem; color: #64748b;">${item.category}</div>
                </div>
              </div>
              <button class="btn-delete" onclick="deleteItem('${item.id}')">ลบ</button>
            </div>
          `).join('');
        }
      } catch (err) {
        container.innerHTML = "โหลดข้อมูลไม่สำเร็จ";
      }
    }

    async function deleteItem(id) {
      if (!confirm("คุณแน่ใจว่าต้องการลบรายการนี้?")) return;

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ action: "delete", password: token, id: id })
        });
        const result = await res.json();
        if (result.success) {
          loadItems();
        } else {
          alert(result.message);
        }
      } catch(err) {
        alert("ไม่สามารถลบข้อมูลได้");
      }
    }
  </script>
</body>
</html>
