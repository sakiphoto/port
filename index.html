<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photographer Portfolio & Live Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: #12161f;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --status-done: #ef4444;
      --status-working: #10b981;
      --status-pending: #64748b;
      --status-avail: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); line-height: 1.6; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(10, 12, 16, 0.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-container {
      max-width: 1200px; margin: 0 auto; display: flex;
      justify-content: space-between; align-items: center; padding: 1.2rem 1.5rem;
    }
    .logo { font-size: 1.25rem; font-weight: 700; color: #fff; cursor: pointer; }
    .logo span { color: var(--accent); }
    nav { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .nav-link {
      color: var(--text-muted); text-decoration: none; padding: 0.5rem 1rem;
      border-radius: 9999px; font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: 0.2s;
    }
    .nav-link:hover, .nav-link.active { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .nav-link.active { color: var(--accent); }

    main { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem 6rem; }
    .page-section { display: none; animation: fadeIn 0.3s ease forwards; }
    .page-section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .hero {
      text-align: center; padding: 3.5rem 1rem 2.5rem;
      background: radial-gradient(circle at center, rgba(56, 189, 248, 0.08) 0%, rgba(10, 12, 16, 0) 70%);
      border-radius: 24px; margin-bottom: 2rem; border: 1px solid var(--border);
    }
    .profile-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px;
      padding: 3rem 2rem; display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: 1.5rem; margin-bottom: 2.5rem;
    }
    .profile-avatar {
      width: 150px; height: 150px; border-radius: 50%; object-fit: cover;
      border: 3px solid var(--accent); box-shadow: 0 0 25px rgba(56, 189, 248, 0.25);
    }
    .profile-name { font-size: 2rem; font-weight: 700; color: #fff; }
    .profile-bio { max-width: 680px; color: var(--text-muted); font-size: 1.05rem; }

    .contact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; width: 100%; max-width: 960px; }
    .contact-card {
      background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border);
      padding: 1rem; border-radius: 12px; text-align: left; text-decoration: none; color: inherit; transition: 0.2s;
      display: block;
    }
    .contact-card:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.04); }
    .contact-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .contact-val { font-size: 0.95rem; font-weight: 600; color: #fff; margin-top: 4px; word-break: break-all; }

    .showcase-title { font-size: 1.4rem; font-weight: 700; margin: 2.5rem 0 1.2rem; }
    .showcase-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .showcase-item { height: 220px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); }
    .showcase-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }

    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; }
    .gallery-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .media-box { width: 100%; height: 260px; background: #000; }
    .media-box img, .media-box video { width: 100%; height: 100%; object-fit: cover; }
    .gallery-info { padding: 1.25rem; }
    .gallery-tag { font-size: 0.75rem; color: var(--accent); text-transform: uppercase; font-weight: 600; }

    /* Calendar Styling */
    .calendar-container {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 1.5rem; margin-bottom: 2rem;
    }
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.5rem; text-align: center; }
    .cal-day-head { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); padding: 0.5rem; }
    .cal-day-cell {
      min-height: 95px; background: rgba(255,255,255,0.02); border: 1px solid var(--border);
      border-radius: 12px; padding: 0.5rem; display: flex; flex-direction: column; align-items: flex-start; text-align: left;
    }
    .cal-day-num { font-size: 0.85rem; font-weight: 700; margin-bottom: 4px; }
    .status-pill {
      font-size: 0.68rem; font-weight: 600; padding: 2px 6px; border-radius: 4px; margin-top: 2px; width: 100%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pill-avail { background: rgba(34, 197, 94, 0.2); color: var(--status-avail); }
    .pill-busy { background: rgba(239, 68, 68, 0.2); color: var(--status-done); }
    .pill-booking { background: rgba(56, 189, 248, 0.2); color: var(--accent); }

    .schedule-toggle { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .toggle-btn { padding: 0.6rem 1.2rem; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-weight: 600; }
    .toggle-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

    .job-row {
      background: var(--bg-card); border-radius: 16px; padding: 1.5rem;
      border: 1px solid var(--border); display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 1.5rem; margin-bottom: 1rem;
    }

    footer { text-align: center; padding: 2.5rem 1.5rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 0.85rem; }
    footer a { color: var(--text-muted); text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo" onclick="navigate('home')" id="navBrand">PHOTOGRAPHER<span>.</span></div>
      <nav>
        <a class="nav-link active" onclick="navigate('home')">ข้อมูลทั่วไป & ช่างภาพ</a>
        <a class="nav-link" onclick="navigate('photos')">ผลงานภาพ</a>
        <a class="nav-link" onclick="navigate('videos')">ผลงานวิดีโอ</a>
        <a class="nav-link" onclick="navigate('schedule')">ตารางงาน & ปฏิทิน</a>
      </nav>
    </div>
  </header>

  <main>
    <section id="sec-home" class="page-section active">
      <div class="hero">
        <h1 style="font-size: 2.5rem; margin-bottom: 0.75rem;" id="heroTitle">Luxury Visual Experience</h1>
        <p style="color: var(--text-muted); max-width: 700px; margin: 0 auto;" id="heroSubtitle">-</p>
      </div>

      <div class="profile-card">
        <img src="" id="profAvatar" class="profile-avatar" alt="Avatar">
        <div>
          <div class="profile-name" id="profName">-</div>
          <div class="profile-bio" id="profBio">-</div>
        </div>

        <div class="contact-grid" id="socialGrid"></div>
      </div>

      <div class="showcase-title">✨ รูปภาพแนะนำหน้าแรก</div>
      <div class="showcase-grid" id="featuredGrid"></div>
    </section>

    <section id="sec-photos" class="page-section">
      <h2 style="margin-bottom: 2rem;">ผลงานภาพถ่าย</h2>
      <div class="gallery" id="photoGallery"></div>
    </section>

    <section id="sec-videos" class="page-section">
      <h2 style="margin-bottom: 2rem;">ผลงานวิดีโอ</h2>
      <div class="gallery" id="videoGallery"></div>
    </section>

    <section id="sec-schedule" class="page-section">
      <div class="schedule-toggle">
        <button class="toggle-btn active" onclick="switchScheduleView('calendar', this)">📅 มุมมองปฏิทินสถานะรับงาน</button>
        <button class="toggle-btn" onclick="switchScheduleView('list', this)">📋 รายงานคิวงานที่รับแล้ว</button>
      </div>

      <div id="viewCalendar">
        <div class="calendar-container">
          <div class="calendar-header">
            <button class="toggle-btn" onclick="changeMonth(-1)">‹ เดือนก่อนหน้า</button>
            <h3 id="calMonthTitle" style="color: #fff;">-</h3>
            <button class="toggle-btn" onclick="changeMonth(1)">เดือนถัดไป ›</button>
          </div>
          <div class="calendar-grid">
            <div class="cal-day-head">อา.</div><div class="cal-day-head">จ.</div><div class="cal-day-head">อ.</div>
            <div class="cal-day-head">พ.</div><div class="cal-day-head">พฤ.</div><div class="cal-day-head">ศ.</div><div class="cal-day-head">ส.</div>
          </div>
          <div class="calendar-grid" id="calDaysGrid" style="margin-top: 0.5rem;"></div>
        </div>
      </div>

      <div id="viewList" style="display: none;">
        <div id="scheduleListVertical"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; Photographer Portfolio. All rights reserved. | <a href="admin.html">เข้าสู่ระบบ Admin</a></p>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzyWvESyDYpi1ndxtFSLpWnC0Y5W4awL1OC9tjJ0HJNe8tFUczDV3Vrr2qPaVgQ0uWaWg/exec";
    let allData = { profile: {}, portfolio: [], schedule: [], calendar: [] };
    let currentCalDate = new Date();

    function navigate(secId) {
      document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      document.getElementById('sec-' + secId).classList.add('active');
      event.target.classList.add('active');
    }

    function switchScheduleView(view, el) {
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      document.getElementById('viewCalendar').style.display = view === 'calendar' ? 'block' : 'none';
      document.getElementById('viewList').style.display = view === 'list' ? 'block' : 'none';
    }

    async function loadData() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if (data.success) {
          allData = data;
          renderProfile();
          renderGallery('photoGallery', data.portfolio.filter(x => x.mediaType === 'image'), 'image');
          renderGallery('videoGallery', data.portfolio.filter(x => x.mediaType === 'video'), 'video');
          renderCalendar();
          renderScheduleVertical();
        }
      } catch (err) { console.error(err); }
    }

    function renderProfile() {
      const p = allData.profile || {};
      document.getElementById("navBrand").innerHTML = `${p.brandName || 'PHOTOGRAPHER'}<span>.</span>`;
      document.getElementById("heroTitle").innerText = p.heroTitle || "Luxury Visual Experience";
      document.getElementById("heroSubtitle").innerText = p.heroSubtitle || "-";
      document.getElementById("profAvatar").src = p.avatarUrl || "https://via.placeholder.com/150";
      document.getElementById("profName").innerText = p.photographerName || "Photographer";
      document.getElementById("profBio").innerText = p.bio || "-";

      const grid = document.getElementById("socialGrid");
      let html = `
        <div class="contact-card"><div class="contact-label">📍 พื้นที่รับงาน</div><div class="contact-val">${p.location || '-'}</div></div>
        <a class="contact-card" href="${p.phone ? 'tel:'+p.phone : '#'}"><div class="contact-label">📱 โทรศัพท์</div><div class="contact-val">${p.phone || '-'}</div></a>
        <a class="contact-card" href="${p.email ? 'mailto:'+p.email : '#'}"><div class="contact-label">✉️ Email</div><div class="contact-val">${p.email || '-'}</div></a>
      `;

      let links = [];
      try { links = JSON.parse(p.socialLinks || "[]"); } catch(e){}
      links.forEach(l => {
        html += `
          <a class="contact-card" href="${l.url}" target="_blank">
            <div class="contact-label">🔗 ${l.label || 'Social'}</div>
            <div class="contact-val">${l.url.replace(/^https?:\/\//, '')}</div>
          </a>
        `;
      });
      grid.innerHTML = html;

      const featGrid = document.getElementById("featuredGrid");
      if (p.featuredPhotos) {
        const photos = p.featuredPhotos.split(',').filter(x => x.trim());
        featGrid.innerHTML = photos.map(u => `<div class="showcase-item"><img src="${u.trim()}" loading="lazy"></div>`).join('');
      } else { featGrid.innerHTML = '<p style="color:var(--text-muted)">ไม่มีรูปภาพแนะนำ</p>'; }
    }

    function renderGallery(elId, items, type) {
      const el = document.getElementById(elId);
      if (!items || !items.length) { el.innerHTML = '<p style="color:var(--text-muted)">ยังไม่มีผลงาน</p>'; return; }
      el.innerHTML = items.map(i => `
        <div class="gallery-card">
          <div class="media-box">
            ${type === 'video' ? `<video src="${i.fileUrl}" controls></video>` : `<img src="${i.fileUrl}" loading="lazy">`}
          </div>
          <div class="gallery-info">
            <div class="gallery-tag">${i.category}</div>
            <div style="font-weight:600; margin-top:4px;">${i.title}</div>
          </div>
        </div>
      `).join('');
    }

    function changeMonth(delta) {
      currentCalDate.setMonth(currentCalDate.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      const year = currentCalDate.getFullYear();
      const month = currentCalDate.getMonth();
      const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
      document.getElementById("calMonthTitle").innerText = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById("calDaysGrid");
      grid.innerHTML = "";

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="cal-day-cell" style="opacity:0.2;"></div>`;
      }

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const calSetting = (allData.calendar || []).find(c => c.date === dateStr);
        const dayBookings = (allData.schedule || []).filter(s => s.date === dateStr);

        let statusPills = "";

        if (dayBookings.length > 0) {
          dayBookings.forEach(b => {
            statusPills += `<div class="status-pill pill-booking">📌 ${b.time}: ${b.title}</div>`;
          });
          if (calSetting && calSetting.availableSlots) {
            statusPills += `<div class="status-pill pill-avail">🟢 ว่าง: ${calSetting.availableSlots}</div>`;
          }
        } else if (calSetting) {
          if (calSetting.statusType === "busy") {
            statusPills = `<div class="status-pill pill-busy">🔴 ไม่ว่าง</div>`;
          } else if (calSetting.statusType === "custom") {
            statusPills = `<div class="status-pill pill-avail">🟢 ว่าง: ${calSetting.availableSlots}</div>`;
          } else {
            statusPills = `<div class="status-pill pill-avail">🟢 ว่างทั้งวัน</div>`;
          }
        } else {
          statusPills = `<div class="status-pill pill-avail">🟢 ว่างทั้งวัน</div>`;
        }

        grid.innerHTML += `
          <div class="cal-day-cell">
            <span class="cal-day-num">${day}</span>
            ${statusPills}
          </div>
        `;
      }
    }

    function renderScheduleVertical() {
      const container = document.getElementById("scheduleListVertical");
      const list = allData.schedule || [];
      if (!list.length) { container.innerHTML = '<p style="color:var(--text-muted);">ยังไม่มีรายการงานที่รับ</p>'; return; }

      const sorted = [...list].sort((a, b) => new Date(a.date) - new Date(b.date));
      container.innerHTML = sorted.map(item => `
        <div class="job-row">
          <div>
            <div style="font-size: 1.2rem; font-weight: 700; color: #fff;">${item.title}</div>
            <div style="color: var(--text-muted); font-size: 0.9rem;">
              📅 <strong>${item.date}</strong> | ⏰ <strong>${item.time}</strong> | 📍 <strong>${item.location || '-'}</strong>
            </div>
            ${item.details ? `<div style="font-size:0.85rem; color:#cbd5e1; margin-top:4px;">📝 ${item.details}</div>` : ''}
          </div>
          ${item.extLink ? `<a href="${item.extLink}" target="_blank" style="padding:0.5rem 1rem; background:var(--accent); color:#000; font-weight:600; border-radius:8px; text-decoration:none;">🔗 เปิดลิงก์งาน</a>` : ''}
        </div>
      `).join('');
    }

    window.onload = loadData;
  </script>
</body>
</html>
