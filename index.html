<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Portfolio & Schedule</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: #12161f;
      --accent: #38bdf8;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 900px; margin: 0 auto; }
    
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; margin-bottom: 2rem; }
    h2 { font-weight: 600; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; }

    .form-group { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; }
    input, select {
      width: 100%; padding: 0.85rem 1rem; background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border); border-radius: 10px; color: #fff; outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }

    .btn {
      width: 100%; padding: 0.85rem; background: var(--accent); color: #000;
      border: none; border-radius: 10px; font-weight: 600; cursor: pointer;
    }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.85rem; width: auto; }
    .btn-outline { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }

    .admin-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; flex-wrap: wrap; }
    .tab-btn {
      background: transparent; border: none; color: var(--text-muted); padding: 0.5rem 1rem;
      border-radius: 8px; cursor: pointer; font-weight: 500;
    }
    .tab-btn.active { color: #000; background: var(--accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .item-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem; background: rgba(255, 255, 255, 0.02); border-radius: 12px;
      margin-bottom: 0.75rem; border: 1px solid var(--border);
    }
    .btn-delete { background: var(--danger); color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">

    <div id="loginSection" class="card" style="max-width: 450px; margin: 4rem auto;">
      <h2>🔐 เข้าสู่ระบบ Admin</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Admin Password</label>
          <input type="password" id="adminPassword" placeholder="ใส่รหัสผ่าน admin" required>
        </div>
        <button type="submit" class="btn" id="loginBtn">เข้าสู่ระบบ</button>
      </form>
    </div>

    <div id="adminPanel" class="hidden">
      <div class="card">
        <h2>
          <span>แดชบอร์ดจัดการระบบ</span>
          <button class="btn btn-outline btn-sm" onclick="logout()">ออกจากระบบ</button>
        </h2>

        <div class="admin-tabs">
          <button class="tab-btn active" onclick="switchTab('tabSchedule')">📅 จัดการตารางงาน & วันว่าง</button>
          <button class="tab-btn" onclick="switchTab('tabUploadMedia')">📷 อัปโหลดผลงาน (ภาพ/วิดีโอ)</button>
          <button class="tab-btn" onclick="switchTab('tabManage')">📋 จัดการข้อมูลทั้งหมด</button>
        </div>

        <!-- 1. เมนูจัดการตารางงาน / กำหนดวันว่าง -->
        <div id="tabSchedule" class="tab-content active">
          <form onsubmit="handleAddSchedule(event)">
            <div class="form-group">
              <label>สถานะของวัน</label>
              <select id="schStatus" required>
                <option value="available">🟢 ว่างรับงาน (Available)</option>
                <option value="booked">🟠 รับงานแล้ว / มีคิวงาน (Booked)</option>
                <option value="busy">🔴 ไม่ว่าง / ติดภารกิจ (Busy)</option>
              </select>
            </div>
            <div class="form-group">
              <label>วันที่</label>
              <input type="date" id="schDate" required>
            </div>
            <div class="form-group">
              <label>ช่วงเวลา</label>
              <input type="text" id="schTime" placeholder="เช่น 09:00 - 16:00 หรือ ทั้งวัน" required>
            </div>
            <div class="form-group">
              <label>ชื่องาน / รายละเอียด (เช่น งานแต่งงานคุณเอ, ว่างคิวบ่าย)</label>
              <input type="text" id="schTitle" placeholder="รายละเอียดงาน" required>
            </div>
            <div class="form-group">
              <label>สถานที่</label>
              <input type="text" id="schLocation" placeholder="เช่น Studio 54, โรงแรมสยาม หรือ -">
            </div>
            <button type="submit" class="btn" id="schBtn">บันทึกตารางงาน</button>
          </form>
        </div>

        <!-- 2. เมนูอัปโหลดผลงาน -->
        <div id="tabUploadMedia" class="tab-content">
          <form onsubmit="handleUploadMedia(event)">
            <div class="form-group">
              <label>ประเภทผลงาน</label>
              <select id="mediaType">
                <option value="image">รูปภาพ (Image)</option>
                <option value="video">วิดีโอ (Video)</option>
              </select>
            </div>
            <div class="form-group">
              <label>ชื่อผลงาน</label>
              <input type="text" id="mediaTitle" placeholder="เช่น Luxury Portrait Shoot" required>
            </div>
            <div class="form-group">
              <label>หมวดหมู่</label>
              <input type="text" id="mediaCategory" placeholder="เช่น Portrait, Fashion, Commercial" required>
            </div>
            <div class="form-group">
              <label>เลือกไฟล์</label>
              <input type="file" id="mediaFile" accept="image/*,video/*" required>
            </div>
            <button type="submit" class="btn" id="uploadBtn">อัปโหลดไฟล์</button>
          </form>
        </div>

        <!-- 3. รายการผลงานและตารางงาน -->
        <div id="tabManage" class="tab-content">
          <h3 style="margin-bottom: 1rem; color: var(--accent);">📅 รายการตารางงาน / คิว</h3>
          <div id="scheduleListContainer">กำลังโหลด...</div>
          
          <h3 style="margin: 2rem 0 1rem; color: var(--accent);">📷 รายการผลงาน Portfolio</h3>
          <div id="portfolioListContainer">กำลังโหลด...</div>
        </div>

      </div>
    </div>

  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzyWvESyDYpi1ndxtFSLpWnC0Y5W4awL1OC9tjJ0HJNe8tFUczDV3Vrr2qPaVgQ0uWaWg/exec";
    let token = sessionStorage.getItem("adminPassword");

    if (token) showPanel();

    async function handleLogin(e) {
      e.preventDefault();
      const pwd = document.getElementById("adminPassword").value;
      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ action: "login", password: pwd }) });
      const data = await res.json();
      if (data.success) {
        sessionStorage.setItem("adminPassword", pwd);
        token = pwd;
        showPanel();
      } else {
        alert("รหัสผ่านไม่ถูกต้อง");
      }
    }

    function showPanel() {
      document.getElementById("loginSection").classList.add("hidden");
      document.getElementById("adminPanel").classList.remove("hidden");
      loadAllData();
    }

    function logout() {
      sessionStorage.removeItem("adminPassword");
      location.reload();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    async function handleAddSchedule(e) {
      e.preventDefault();
      const payload = {
        action: "addSchedule",
        password: token,
        status: document.getElementById("schStatus").value,
        date: document.getElementById("schDate").value,
        time: document.getElementById("schTime").value,
        title: document.getElementById("schTitle").value,
        location: document.getElementById("schLocation").value
      };
      
      const btn = document.getElementById("schBtn");
      btn.innerText = "กำลังบันทึก...";
      btn.disabled = true;

      const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
      const result = await res.json();
      btn.innerText = "บันทึกตารางงาน";
      btn.disabled = false;

      if (result.success) {
        alert("บันทึกตารางงานสำเร็จ!");
        e.target.reset();
        loadAllData();
      } else {
        alert(result.message);
      }
    }

    async function handleUploadMedia(e) {
      e.preventDefault();
      const file = document.getElementById("mediaFile").files[0];
      if (!file) return;

      const btn = document.getElementById("uploadBtn");
      btn.innerText = "กำลังอัปโหลด...";
      btn.disabled = true;

      const reader = new FileReader();
      reader.onload = async function() {
        const payload = {
          action: "upload",
          password: token,
          mediaType: document.getElementById("mediaType").value,
          title: document.getElementById("mediaTitle").value,
          category: document.getElementById("mediaCategory").value,
          fileName: file.name,
          fileData: reader.result
        };

        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await res.json();
        btn.innerText = "อัปโหลดไฟล์";
        btn.disabled = false;

        if (result.success) {
          alert("อัปโหลดสำเร็จ!");
          e.target.reset();
          loadAllData();
        } else {
          alert(result.message);
        }
      };
      reader.readAsDataURL(file);
    }

    async function loadAllData() {
      const res = await fetch(API_URL);
      const result = await res.json();
      if (!result.success) return;

      // Render Schedule list
      const sContainer = document.getElementById("scheduleListContainer");
      sContainer.innerHTML = (result.schedule && result.schedule.length) ? result.schedule.map(item => `
        <div class="item-card">
          <div>
            <strong>${item.date} (${item.time})</strong> - ${item.title}
            <div style="font-size: 0.8rem; color: var(--text-muted);">${item.location} | สถานะ: ${item.status}</div>
          </div>
          <button class="btn-delete" onclick="deleteItem('${item.id}', 'schedule')">ลบ</button>
        </div>
      `).join('') : '<p style="color: var(--text-muted);">ไม่มีรายการตารางงาน</p>';

      // Render Portfolio list
      const pContainer = document.getElementById("portfolioListContainer");
      pContainer.innerHTML = (result.portfolio && result.portfolio.length) ? result.portfolio.map(item => `
        <div class="item-card">
          <div>
            <strong>${item.title}</strong>
            <div style="font-size: 0.8rem; color: var(--text-muted);">${item.category} (${item.mediaType})</div>
          </div>
          <button class="btn-delete" onclick="deleteItem('${item.id}', 'portfolio')">ลบ</button>
        </div>
      `).join('') : '<p style="color: var(--text-muted);">ไม่มีผลงาน</p>';
    }

    async function deleteItem(id, type) {
      if (!confirm("ต้องการลบข้อมูลนี้หรือไม่?")) return;
      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "delete", password: token, id: id, type: type })
      });
      const result = await res.json();
      if (result.success) loadAllData();
      else alert(result.message);
    }
  </script>
</body>
</html>
